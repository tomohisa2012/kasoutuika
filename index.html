<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Crypto Sim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>💰 Crypto Sim</h1>

<div class="container">

  <div class="panel">
    <h2>価格</h2>
    <div id="price">0</div>
    <canvas id="chart" width="300" height="150"></canvas>
  </div>

  <div class="panel">
    <h2>あなたの資産</h2>
    <p>現金: <span id="cash"></span></p>
    <p>コイン: <span id="coin"></span></p>
    <p>合計: <span id="total"></span></p>
  </div>

  <div class="panel">
    <h2>売買</h2>
    <input type="number" id="amount" placeholder="数量">
    <button onclick="buy()">BUY</button>
    <button onclick="sell()">SELL</button>
  </div>

  <div class="panel">
    <h2>ランキング（1週間）</h2>
    <ol id="ranking"></ol>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
